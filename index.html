<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كشوف تقدير درجات مادة اللغة الإنجليزية</title>

    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 50%, #7dd3fc 100%);
            --glass-bg: rgba(255, 255, 255, 0.6);
            --glass-border: rgba(255, 255, 255, 0.9);
            --glass-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
            --text-color: #0f172a;
            --primary-blue: #0284c7;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 10px;
        }

        /* Top Navigation Bar & Tools */
        .top-bar {
            position: fixed;
            top: 10px;
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            padding: 8px 20px;
            box-shadow: var(--glass-shadow);
            z-index: 1000;
        }

        .tabs-container {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .tab-btn {
            background: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.9);
            padding: 6px 14px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: bold;
            color: var(--text-color);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tab-btn:hover {
            background: rgba(2, 132, 199, 0.2);
            transform: translateY(-2px);
        }

        .tab-btn.active {
            background: linear-gradient(135deg, #0284c7, #0369a1);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.4);
        }

        .controls-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .control-btn {
            background: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.9);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-size: 15px;
            font-weight: bold;
            color: var(--text-color);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .control-btn:hover {
            background: rgba(255, 255, 255, 0.9);
            transform: scale(1.05);
        }

        /* Main Container */
        .main-wrapper {
            margin-top: 70px;
            margin-bottom: 45px;
            width: 100%;
            max-width: 100%;
            transition: transform 0.2s ease;
            transform-origin: top center;
        }

        .tab-content {
            display: none;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 15px;
            box-shadow: var(--glass-shadow);
        }

        .tab-content.active {
            display: block;
            animation: fadeIn 0.3s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Optimized Header Info Section */
        .sheet-header {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 10px;
            background: rgba(255, 255, 255, 0.7);
            padding: 10px 12px;
            border-radius: 8px;
            border: 2px solid #0284c7;
        }

        .header-row {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
            justify-content: space-between;
            width: 100%;
        }

        .header-item {
            display: flex;
            align-items: center;
            gap: 5px;
            flex: 1;
            min-width: 200px;
        }

        .header-item label {
            font-size: 12px;
            font-weight: bold;
            color: #0369a1;
            white-space: nowrap;
        }

        .header-item input, .header-item select {
            width: 100%;
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid #0284c7;
            padding: 4px 6px;
            border-radius: 6px;
            font-size: 12px;
            color: var(--text-color);
            outline: none;
        }

        .header-item input:focus, .header-item select:focus {
            border-color: #0369a1;
            background: #ffffff;
            box-shadow: 0 0 5px rgba(2, 132, 199, 0.3);
        }

        /* Print Page Controls Bar */
        .print-controls-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.6);
            padding: 6px 12px;
            border-radius: 6px;
            margin-bottom: 8px;
            font-size: 12px;
            font-weight: bold;
            border: 1px solid #bae6fd;
        }

        .print-controls-bar input {
            width: 70px;
            padding: 2px 4px;
            text-align: center;
            border: 1px solid #0284c7;
            border-radius: 4px;
            background: #fff;
        }

        /* Tables & Pages Container */
        .table-container {
            width: 100%;
            overflow-x: auto;
            border-radius: 6px;
            background: transparent;
            margin-bottom: 10px;
        }

        .print-page {
            border: 2px solid #0284c7;
            background: #ffffff;
            margin-bottom: 20px;
            padding: 12px;
            border-radius: 8px;
            position: relative;
            box-shadow: 0 4px 15px rgba(2, 132, 199, 0.1);
            page-break-inside: avoid;
            break-inside: avoid;
        }

        .page-footer-pagination {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            font-weight: bold;
            margin-top: 8px;
            padding-top: 5px;
            border-top: 1px solid #bae6fd;
            color: #0369a1;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
            font-size: 11px;
        }

        th, td {
            border: 1.5px solid #0284c7;
            padding: 3px 2px;
            vertical-align: middle;
            height: 26px;
        }

        th {
            background: #bae6fd;
            color: #0f172a;
            font-weight: bold;
            font-size: 11px;
        }

        tr:nth-child(even) {
            background: #f0f9ff;
        }

        td input[type="text"], td input[type="number"] {
            width: 100%;
            background: transparent;
            border: none;
            text-align: center;
            font-size: 11px;
            color: var(--text-color);
            outline: none;
        }

        .calc-cell {
            font-weight: bold;
            color: #0369a1;
            background: #e0f2fe;
        }

        /* Signatures Section */
        .signatures-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 10px;
            text-align: center;
            padding-top: 8px;
            border-top: 1.5px dashed #0284c7;
            page-break-inside: avoid;
            break-inside: avoid;
        }

        .signature-box {
            font-weight: bold;
            font-size: 12px;
            color: #0f172a;
            background: #f8fafc;
            padding: 6px;
            border-radius: 6px;
            border: 1px solid #7dd3fc;
        }

        /* Action Buttons Row */
        .action-row {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 8px;
            flex-wrap: wrap;
            align-items: center;
        }

        .btn-action {
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            color: #ffffff;
            transition: all 0.2s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .btn-print { background: linear-gradient(135deg, #0284c7, #0369a1); }
        .btn-export { background: linear-gradient(135deg, #10b981, #059669); }
        .btn-import { background: linear-gradient(135deg, #f59e0b, #d97706); }
        .btn-gsheet { background: linear-gradient(135deg, #8b5cf6, #6d28d9); }
        .btn-action:hover { opacity: 0.9; transform: translateY(-1px); }

        /* Floating Toggle & Footer */
        .floating-toggle {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 45px;
            height: 45px;
            background: linear-gradient(135deg, #0284c7, #0369a1);
            color: white;
            border: none;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(2, 132, 199, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        footer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 24px;
            background: linear-gradient(90deg, #0284c7, #10b981, #0284c7);
            background-size: 200% 100%;
            animation: gradientMove 6s linear infinite;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
            color: white;
            z-index: 900;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .hidden-ui {
            opacity: 0;
            pointer-events: none;
            transform: translateY(-15px);
            transition: all 0.3s ease;
        }

        @media print {
            .top-bar, .floating-toggle, footer, .action-row, .print-controls-bar {
                display: none !important;
            }
            body {
                background: white !important;
                padding: 0 !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            .tab-content {
                background: white !important;
                box-shadow: none !important;
                border: none !important;
                padding: 0 !important;
            }
            .main-wrapper {
                margin: 0 !important;
                transform: none !important;
            }
            .print-page {
                page-break-after: always !important;
                page-break-inside: avoid !important;
                break-after: page !important;
                break-inside: avoid !important;
                border: 2px solid #0284c7 !important;
                margin: 0 0 5mm 0 !important;
                padding: 6px !important;
                box-shadow: none !important;
                height: auto !important;
                max-height: 96vh !important;
                overflow: hidden !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            th {
                background: #bae6fd !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            tr:nth-child(even) {
                background: #f0f9ff !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            .calc-cell {
                background: #e0f2fe !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            #tab-0 {
                @page { size: portrait; margin: 4mm; }
            }
            #tab-1, #tab-2 {
                @page { size: landscape; margin: 4mm; }
            }
        }
    </style>
</head>

        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbydUp-X6VVAIFNll4wfj4Lr0E-CfkdPtRWe4Duyo3o/dev";

        function saveToGoogleSheet() {
            const payload = { sheets: [] };

            for (let tabIndex = 0; tabIndex <= 2; tabIndex++) {
                const tabContent = document.getElementById(`tab-${tabIndex}`);
                if (!tabContent) continue;

                let sheetName = tabIndex === 0 ? "النموذج_الأول" : (tabIndex === 1 ? "اكتوبر" : "نوفمبر");

                const rows = tabContent.querySelectorAll('tbody tr');
                const data = [];

                const headers = [];
                tabContent.querySelectorAll('thead tr:last-child th, th').forEach(th => {
                    headers.push(th.innerText.replace(/\n/g, ' '));
                });
                data.push(headers);

                rows.forEach(row => {
                    const rowData = [];
                    row.querySelectorAll('td').forEach(td => {
                        const input = td.querySelector('input');
                        if (input) {
                            if (input.type === 'checkbox') {
                                rowData.push(input.checked ? 'TRUE' : 'FALSE');
                            } else {
                                rowData.push(input.value);
                            }
                        } else {
                            rowData.push(td.innerText);
                        }
                    });
                    data.push(rowData);
                });

                payload.sheets.push({
                    name: sheetName,
                    rows: data
                });
            }

            alert("جاري إرسال البيانات وحفظها في جوجل شيت...");

            // استخدام تقنية Form للتغلب على قيود متصفحات الويب وعقبة CORS
            const form = document.createElement('form');
            form.method = 'POST';
            form.action = WEB_APP_URL;
            form.target = '_blank';

            const input = document.createElement('input');
            input.type = 'hidden';
            input.name = 'data';
            input.value = JSON.stringify(payload);

            form.appendChild(input);
            document.body.appendChild(form);
            form.submit();
            document.body.removeChild(form);

            alert("تم إرسال البيانات بنجاح! تفقد ملف جوجل شيت لتراها فوراً.");
        }

        function loadFromGoogleSheet() {
            fetch(WEB_APP_URL)
                .then(res => res.json())
                .then(data => {
                    if (!data.sheets) return;

                    data.sheets.forEach((sheetObj) => {
                        let targetTabIdx = -1;
                        if (sheetObj.name.includes("النموذج_الأول")) targetTabIdx = 0;
                        else if (sheetObj.name.includes("اكتوبر")) targetTabIdx = 1;
                        else if (sheetObj.name.includes("نوفمبر")) targetTabIdx = 2;

                        if (targetTabIdx === -1) return;

                        const tabContent = document.getElementById(`tab-${targetTabIdx}`);
                        if (!tabContent) return;

                        const rows = tabContent.querySelectorAll('tbody tr');
                        const sheetRows = sheetObj.rows;

                        for (let i = 1; i < sheetRows.length && (i - 1) < rows.length; i++) {
                            const excelRow = sheetRows[i];
                            const targetRow = rows[i - 1];
                            const inputs = targetRow.querySelectorAll('input');
                            
                            if (excelRow[1] !== undefined && inputs[0]) {
                                inputs[0].value = excelRow[1];
                            }
                            for (let j = 2; j < excelRow.length && (j - 2) < inputs.length; j++) {
                                if (inputs[j - 1]) {
                                    if (inputs[j - 1].type === 'checkbox') {
                                        inputs[j - 1].checked = (excelRow[j] === 'TRUE' || excelRow[j] === true || excelRow[j] === 'true');
                                    } else {
                                        inputs[j - 1].value = excelRow[j] !== undefined && excelRow[j] !== null ? excelRow[j] : '';
                                    }
                                    inputs[j - 1].dispatchEvent(new Event('input'));
                                }
                            }
                        }
                    });

                    updateTab0DynamicAverages();
                })
                .catch(err => {
                    console.log("جارٍ تهيئة البيانات:", err);
                });
        }

        function validateMax(input) {
            const max = parseFloat(input.getAttribute('max'));
            let val = parseFloat(input.value);
            if (!isNaN(max) && !isNaN(val)) {
                if (val > max) {
                    input.value = max;
                } else if (val < 0) {
                    input.value = 0;
                }
            }
        }

        function handleArrowNavigation(e) {
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) {
                const currentInput = e.target;
                if (currentInput.tagName !== 'INPUT') return;
                
                const cell = currentInput.closest('td, th');
                const row = currentInput.closest('tr');
                if (!cell || !row) return;

                const cellIndex = Array.from(row.children).indexOf(cell);
                let targetRow = null;

                if (e.key === 'ArrowUp') {
                    targetRow = row.previousElementSibling;
                    if (!targetRow) {
                        const prevPage = row.closest('.print-page').previousElementSibling;
                        if (prevPage) {
                            const rows = prevPage.querySelectorAll('tbody tr');
                            targetRow = rows[rows.length - 1];
                        }
                    }
                } else if (e.key === 'ArrowDown') {
                    targetRow = row.nextElementSibling;
                    if (!targetRow) {
                        const nextPage = row.closest('.print-page').nextElementSibling;
                        if (nextPage) {
                            const rows = nextPage.querySelectorAll('tbody tr');
                            targetRow = rows[0];
                        }
                    }
                } else if (e.key === 'ArrowLeft') {
                    const nextCell = cell.nextElementSibling;
                    if (nextCell) {
                        const nextInput = nextCell.querySelector('input');
                        if (nextInput) {
                            e.preventDefault();
                            nextInput.focus();
                            if(nextInput.type === 'text' || nextInput.type === 'number') nextInput.select();
                        }
                    }
                    return;
                } else if (e.key === 'ArrowRight') {
                    const prevCell = cell.previousElementSibling;
                    if (prevCell) {
                        const prevInput = prevCell.querySelector('input');
                        if (prevInput) {
                            e.preventDefault();
                            prevInput.focus();
                            if(prevInput.type === 'text' || prevInput.type === 'number') prevInput.select();
                        }
                    }
                    return;
                }

                if (targetRow) {
                    const targetCell = targetRow.children[cellIndex];
                    if (targetCell) {
                        const targetInput = targetCell.querySelector('input');
                        if (targetInput) {
                            e.preventDefault();
                            targetInput.focus();
                            if(targetInput.type === 'text' || targetInput.type === 'number') targetInput.select();
                        }
                    }
                }
            }
        }

        function calculateAbsence(inputEl) {
            const row = inputEl.closest('tr');
            const pageContainer = row.closest('.print-page');
            if (!pageContainer) return;
            
            const absenceCheckboxes = pageContainer.querySelectorAll('.absence-checkbox');
            let activeDaysCount = 0;
            absenceCheckboxes.forEach(cb => {
                if (cb.checked) activeDaysCount++;
            });

            const absenceInputs = row.querySelectorAll('.absence-input');
            let studentAbsenceCount = 0;
            absenceInputs.forEach(inp => {
                if (inp.value.trim() === 'غ') studentAbsenceCount++;
            });

            let absenceScore = 10;
            if (activeDaysCount > 0) {
                let ratio = studentAbsenceCount / activeDaysCount;
                if (ratio > 1) ratio = 1;
                absenceScore = 10 - (ratio * 10);
            }
            absenceScore = Math.round(absenceScore * 10) / 10;

            const attendanceCell = row.querySelector('.calc-attendance-score');
            if (attendanceCell) {
                attendanceCell.innerText = absenceScore;
            }

            calcLandscape(row);
        }

        function updateAllAbsenceScoresInPage(checkboxEl) {
            const pageContainer = checkboxEl.closest('.print-page');
            if (!pageContainer) return;
            const rows = pageContainer.querySelectorAll('tbody tr');
            rows.forEach(row => {
                const firstAbsenceInput = row.querySelector('.absence-input');
                if(firstAbsenceInput) calculateAbsence(firstAbsenceInput);
            });
        }

        function calcLandscape(row) {
            const numInputs = row.querySelectorAll('input[type="number"]');
            if (numInputs.length >= 9) {
                let h1 = parseFloat(numInputs[0].value) || 0;
                let h2 = parseFloat(numInputs[1].value) || 0;
                let h3 = parseFloat(numInputs[2].value) || 0;
                let h4 = parseFloat(numInputs[3].value) || 0;
                
                let sumHw = h1 + h2 + h3 + h4;
                const totalHwCell = row.querySelector('.calc-total-hw');
                if(totalHwCell) totalHwCell.innerText = sumHw;

                let w1 = parseFloat(numInputs[4].value) || 0;
                let w2 = parseFloat(numInputs[5].value) || 0;
                let w3 = parseFloat(numInputs[6].value) || 0;
                let w4 = parseFloat(numInputs[7].value) || 0;
                
                let sumAssessments = w1 + w2 + w3 + w4;
                const totalAssCell = row.querySelector('.calc-total-assessments');
                if(totalAssCell) totalAssCell.innerText = sumAssessments;
            }
            updateTab0DynamicAverages();
        }

        function updateTab0DynamicAverages() {
            const container0 = document.getElementById('container-0');
            if (!container0) return;
            const rows0 = container0.querySelectorAll('tbody tr');

            rows0.forEach((row0, index) => {
                const row1 = document.querySelector(`#container-1 tbody tr:nth-child(${index + 1})`);
                const row2 = document.querySelector(`#container-2 tbody tr:nth-child(${index + 1})`);

                const cells0 = row0.querySelectorAll('td');
                if (cells0.length >= 9 && row1 && row2) {
                    const nameInput1 = row1.querySelector('.student-name');
                    const nameInput0 = row0.querySelector('.student-name');
                    if(nameInput1 && nameInput0 && !nameInput0.value) {
                        nameInput0.value = nameInput1.value;
                    }

                    const numInputs1 = row1.querySelectorAll('input[type="number"]');
                    const octTest = numInputs1.length > 0 ? parseFloat(numInputs1[numInputs1.length - 1].value) || 0 : 0;
                    cells0[2].innerText = octTest;

                    const numInputs2 = row2.querySelectorAll('input[type="number"]');
                    const novTest = numInputs2.length > 0 ? parseFloat(numInputs2[numInputs2.length - 1].value) || 0 : 0;
                    cells0[3].innerText = novTest;

                    const totalTests = octTest + novTest;
                    cells0[4].innerText = totalTests;

                    const att1 = parseFloat(row1.querySelector('.calc-attendance-score')?.innerText) || 10;
                    const att2 = parseFloat(row2.querySelector('.calc-attendance-score')?.innerText) || 10;
                    const avgAtt = Math.round(((att1 + att2) / 2) * 10) / 10;
                    cells0[5].innerText = avgAtt;

                    const hw1 = parseFloat(row1.querySelector('.calc-total-hw')?.innerText) || 0; 
                    const hw2 = parseFloat(row2.querySelector('.calc-total-hw')?.innerText) || 0; 
                    const avgHw10 = Math.round(((hw1 + hw2) / 2) * 10) / 10; 
                    cells0[6].innerText = avgHw10;

                    const ass1 = parseFloat(row1.querySelector('.calc-total-assessments')?.innerText) || 0; 
                    const ass2 = parseFloat(row2.querySelector('.calc-total-assessments')?.innerText) || 0; 
                    const avgAss = Math.round(((ass1 + ass2) / 2) * 10) / 10;
                    cells0[7].innerText = avgAss;

                    const grandTotal = totalTests + avgAtt + avgHw10 + avgAss;
                    cells0[8].innerText = Math.round(grandTotal * 10) / 10;
                }
            });
        }

        function handleStudentPaste(e, rowIndex, pageNum) {
            e.preventDefault();
            const clipboardData = e.clipboardData || window.clipboardData;
            const pastedText = clipboardData.getData('Text');
            const lines = pastedText.split(/\r\n|\n|\r/).filter(line => line.trim() !== '');

            const pageSizeInput = document.getElementById(`page-size-0`);
            const pageSize = pageSizeInput ? parseInt(pageSizeInput.value) || 25 : 25;

            const startGlobalIdx = pageNum * pageSize + rowIndex;
            let currentGlobalIdx = startGlobalIdx;

            lines.forEach(name => {
                [0, 1, 2].forEach(tIdx => {
                    const container = document.getElementById(`container-${tIdx}`);
                    if (container) {
                        const inputs = container.querySelectorAll('.student-name');
                        if (inputs[currentGlobalIdx]) {
                            inputs[currentGlobalIdx].value = name.trim();
                        }
                    }
                });
                currentGlobalIdx++;
            });
            updateTab0DynamicAverages();
        }

        function syncStudentName(inputEl, rowIndex, pageNum) {

            const pageSizeInput = document.getElementById(`page-size-0`);
            const pageSize = pageSizeInput ? parseInt(pageSizeInput.value) || 25 : 25;
            const globalRowIdx = pageNum * pageSize + rowIndex;

            [1, 2].forEach(tIdx => {

                    if (allInputs[globalRowIdx]) {

        function syncStudentNameFromTab1(inputEl) {
            const row = inputEl.closest('tr');

            let globalIdx = 0;
            const allPages = container.querySelectorAll('.print-page');
            const pageSizeInput = container.closest('.tab-content').querySelector('input[id^="page-size-"]');
            const pageSize = pageSizeInput ? parseInt(pageSizeInput.value) || 25 : 25;

            allPages.forEach((p, pIdx) => {
                const rowsInP = p.querySelectorAll('tbody tr');
                rowsInP.forEach((r, rIdx) => {
                    if (r === row) {
                        globalIdx = pIdx * pageSize + rIdx;

            const val = inputEl.value;
            [0, 1, 2].forEach(tIdx => {
                const c = document.getElementById(`container-${tIdx}`);
                if (c) {
                    const inputs = c.querySelectorAll('.student-name');
                    if (inputs[globalIdx]) {

        function exportExcel() {
            const wb = XLSX.utils.book_new();

            for (let tabIndex = 0; tabIndex <= 2; tabIndex++) {
                const tabContent = document.getElementById(`tab-${tabIndex}`);
                if (!tabContent) continue;
                
                const classNameInput = tabContent.querySelector('.header-class-name');
                const classNameVal = classNameInput && classNameInput.value.trim() ? classNameInput.value.trim() : `النموذج_${tabIndex + 1}`;

                const rows = tabContent.querySelectorAll('tbody tr');
                const data = [];

                const headers = [];
                tabContent.querySelectorAll('thead tr:last-child th, th').forEach(th => {
                    headers.push(th.innerText.replace(/\n/g, ' '));
                });
                data.push(headers);

                rows.forEach(row => {
                    const rowData = [];
                    row.querySelectorAll('td').forEach(td => {
                        const input = td.querySelector('input');
                        if (input) {
                            rowData.push(input.value);
                        } else {
                            rowData.push(td.innerText);
                        }
                    });
                    data.push(rowData);
                });

                const ws = XLSX.utils.aoa_to_sheet(data);
                XLSX.utils.book_append_sheet(wb, ws, classNameVal);
            }

            XLSX.writeFile(wb, `كشوف_درجات_اللغة_الإنجليزية_الشاملة.xlsx`);
        }

        function importExcel(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, {type: 'array'});

                workbook.SheetNames.forEach((sheetName, sIdx) => {
                    if (sIdx > 2) return;
                    const worksheet = workbook.Sheets[sheetName];
                    const json = XLSX.utils.sheet_to_json(worksheet, {header: 1});

                    const tabContent = document.getElementById(`tab-${sIdx}`);
                    if (!tabContent) return;
                    const rows = tabContent.querySelectorAll('tbody tr');

                    for (let i = 1; i < json.length && i <= rows.length; i++) {
                        const excelRow = json[i];
                        const targetRow = rows[i - 1];
                        const inputs = targetRow.querySelectorAll('input');
                        
                        if (excelRow[1] !== undefined && inputs[0]) {
                            inputs[0].value = excelRow[1];
                        }
                        for (let j = 2; j < excelRow.length && (j - 2) < inputs.length; j++) {
                            if (inputs[j - 1]) {
                                inputs[j - 1].value = excelRow[j] !== undefined ? excelRow[j] : '';
                                inputs[j - 1].dispatchEvent(new Event('input'));
                            }
                        }
                    }
                });

                updateTab0DynamicAverages();
                alert('تم استيراد كافة البيانات بنجاح واستعادتها كاملة!');
                event.target.value = '';
            };
            reader.readAsArrayBuffer(file);
        }

        function switchTab(index) {
            const tabs = document.querySelectorAll('.tab-content');
            const buttons = document.querySelectorAll('.tab-btn');
            
            tabs.forEach((tab, idx) => {
                tab.classList.remove('active');
                if(buttons[idx]) buttons[idx].classList.remove('active');
            });

            if(tabs[index]) tabs[index].classList.add('active');
            if(buttons[index]) buttons[index].classList.add('active');
        }

        let currentZoom = 1;
        function adjustZoom(amount) {
            currentZoom += amount;
            if (currentZoom < 0.7) currentZoom = 0.7;
            if (currentZoom > 1.3) currentZoom = 1.3;
            document.getElementById('mainWrapper').style.transform = `scale(${currentZoom})`;
        }

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        function toggleUI() {
            const topBar = document.getElementById('topBar');
            if(topBar) topBar.classList.toggle('hidden-ui');
        }

        window.onload = function() {
            generateTables();
            const monthSelects = document.querySelectorAll('.month-select');
            if(monthSelects.length >= 2) {
                monthSelects[0].value = 'اكتوبر';
                monthSelects[1].value = 'نوفمبر';
            }
            // استعادة البيانات تلقائياً وتعبئة الأسماء والدرجات فور فتح الصفحة
            loadFromGoogleSheet();
        };
    </script>
</body>
</html>
